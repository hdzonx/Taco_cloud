<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <title>Taco Cloud</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
    <body>
    <h1>Design your taco!</h1>
    <img th:src="@{/images/TacoCloud.png}" alt="taco image"/>

    <form method="POST" th:object="${taco}">
        <div class="grid">
            <div class="ingredient-group" id="wrap">
                <h3>Design your wrap:</h3>
                <div th:each="ingredient: ${wrap}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span> <br/>
                </div>
            </div>

            <div class="ingredient_group" id ="proteins">
                <h3 Pick your protein></h3>
                <div th:eaxh="ingredient: ${protein}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span> <br/>
            </div>
            </div>

            <div class="ingredient_group" id ="cheese">
                <h3 Pick your protein></h3>
                <div th:eaxh="ingredient: ${cheese}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span> <br/>
                </div>
            </div>

            <div class="ingredient_group" id ="vegies">
                <h3 Pick your protein></h3>
                <div th:eaxh="ingredient: ${vegies}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span> <br/>
                </div>
            </div>

            <div class="ingredient_group" id ="sauce">
                <h3 Pick your protein></h3>
                <div th:eaxh="ingredient: ${sauce}">
                    <input th:field="*{ingredients}" type="checkbox"
                           th:value="${ingredient.id}"/>
                    <span th:text="${ingredient.name}">INGREDIENT</span> <br/>
                </div>
            </div>
        </div>

        <div>
            <h3> Name your taco creation:</h3>
            <input type = "text" th:field="*{name}">
            <br>
            <button> Submite yout taco</button>
        </div>
    </form>
    </body>
</html>
